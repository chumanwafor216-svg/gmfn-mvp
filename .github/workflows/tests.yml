
name: Backend Tests

on:
  push:
    paths:
      - "gmfn_backend/**"
      - "render.yaml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "gmfn_backend/**"
      - "render.yaml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gmfn_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q tests

  postgres-concurrency:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gmfn_test
          POSTGRES_PASSWORD: gmfn_test_only
          POSTGRES_DB: gmfn_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gmfn_test -d gmfn_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: gmfn_backend

    env:
      SPOTLIGHT_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://gmfn_test:gmfn_test_only@127.0.0.1:5432/gmfn_disposable_test
      GSN_ALLOW_DESTRUCTIVE_DISPOSABLE_DB_TESTS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run PostgreSQL concurrency tests
        run: |
          python -m pytest -q \
            tests/test_postgres_corrected_community_entry_concurrency.py \
            --junitxml=postgres-concurrency.xml

      - name: Require three passing tests with none skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("postgres-concurrency.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {
              name: sum(int(suite.attrib.get(name, 0)) for suite in suites)
              for name in ("tests", "skipped", "failures", "errors")
          }
          expected = {"tests": 3, "skipped": 0, "failures": 0, "errors": 0}
          if totals != expected:
              raise SystemExit(f"PostgreSQL concurrency requirement not met: {totals}")
          print("PostgreSQL concurrency requirement met: 3 passed, 0 skipped")
          PY
