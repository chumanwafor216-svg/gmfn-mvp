services:
  - type: web
    name: gmfn-api
    runtime: python
    rootDir: gmfn_backend
    region: frankfurt
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data/gmfn-uploads
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gmfn-postgres
          property: connectionString
      - key: GMFN_DEV_MODE
        value: "0"
      - key: GMFN_AUTO_CREATE_SCHEMA
        value: "0"
      - key: GMFN_ENTRY_PHONE_DELIVERY
        value: registration-only
      - key: GSN_PHONE_VERIFICATION_ENABLED
        value: "0"
      - key: GSN_PHONE_VERIFICATION_PROVIDER
        value: twilio_verify
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: GSN_PIPELINE_CREDIT_ACCOUNT_ID_PHONE_SMS_OR_VERIFY_DELIVERY
        sync: false
      - key: GSN_PIPELINE_CREDIT_COST_PHONE_SMS_OR_VERIFY_DELIVERY
        sync: false
      - key: GMFN_ENABLE_RECONCILIATION_LOOP
        value: "0"
      - key: GSN_ENABLE_SPOTLIGHT_RETENTION_LOOP
        # Keep disabled until the existing expired-campaign backlog has been
        # reviewed and the first bounded production batch is explicitly approved.
        value: "0"
      - key: GSN_SPOTLIGHT_RETENTION_INTERVAL_SECONDS
        value: "3600"
      - key: GSN_SPOTLIGHT_RETENTION_STARTUP_DELAY_SECONDS
        value: "300"
      - key: GSN_SPOTLIGHT_RETENTION_BATCH_SIZE
        value: "25"
      - key: GSN_RUNTIME_MEMORY_LOGGING
        value: "1"
      - key: GSN_RUNTIME_MEMORY_SAMPLE_SECONDS
        value: "60"
      - key: GMFN_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: GMFN_UPLOADS_DIR
        value: /var/data/gmfn-uploads
      - key: GMFN_SECRET_KEY
        generateValue: true
      - key: GMFN_HMAC_SECRET
        generateValue: true
      - key: GMFN_CORS_ORIGINS
        sync: false
      - key: GMFN_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

  - type: web
    name: gmfn-frontend
    runtime: node
    rootDir: frontend
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: gmfn-postgres
    region: frankfurt
    plan: basic-1gb
    postgresMajorVersion: "16"
    ipAllowList: []
